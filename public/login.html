<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Sign in — Friday</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1rem; }
      main { width: min(100%, 24rem); border: 1px solid #27272a; border-radius: 16px; background: #111114; padding: 2rem; box-shadow: 0 24px 80px #0008; }
      .brand { margin: 0 0 .35rem; color: #c4b5fd; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 1.6rem; }
      p { color: #a1a1aa; line-height: 1.5; }
      form { display: grid; gap: .75rem; margin-top: 1.5rem; }
      label { font-size: .85rem; font-weight: 600; }
      input, button { width: 100%; min-height: 2.8rem; border-radius: 9px; font: inherit; }
      input { border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; padding: .65rem .75rem; }
      input:focus { outline: 2px solid #8b5cf6; outline-offset: 1px; }
      button { border: 0; background: #7c3aed; color: white; cursor: pointer; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .65; }
      #login-toast { position: fixed; z-index: 2; top: 1rem; left: 50%; transform: translateX(-50%); border: 1px solid #6b5ca5; border-radius: 10px; background: #201b32; box-shadow: 0 8px 24px #0008; color: #ddd6fe; padding: .7rem 1rem; font-size: .9rem; }
      #login-toast[hidden] { display: none; }
      #error { min-height: 1.3rem; margin: 0; color: #fda4af; font-size: .85rem; }
    </style>
    <script src="/login.js" defer></script>
  </head>
  <body>
    <div id="login-toast" role="status" aria-live="polite" hidden>Login required</div>
    <main>
      <p class="brand">Friday</p>
      <h1>Sign in</h1>
      <p>Enter your password to continue.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <p id="error" role="alert" aria-live="polite"></p>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
